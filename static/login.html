<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>OnCall Rehearsal Agent — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <div class="sim-banner" role="banner" aria-label="Environment notice"></div>
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-icon" aria-hidden="true">🔥</span>
        <h1 class="auth-title"></h1>
        <p class="auth-subtitle"></p>
      </div>

      <div class="alert alert-error hidden" id="error-box" role="alert" aria-live="polite"></div>

      <form id="login-form" method="POST" action="/login" novalidate>
        <input type="hidden" id="csrf_token" name="csrf_token">

        <div class="form-group">
          <label for="username" class="form-label"></label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            autocomplete="username"
            maxlength="64"
            required
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label"></label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            autocomplete="current-password"
            maxlength="256"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <span id="btn-text"></span>
          <span id="btn-spinner" class="spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
